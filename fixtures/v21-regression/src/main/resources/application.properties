# Bug 4: v2.0 split "${GITHUB_CLIENTSECRET:}" at ':' and reported a 1-character CRITICAL secret.
# Expected v2.1: no finding for these two lines (placeholder / OAuth client credential, not key material).
spring.security.oauth2.client.registration.github.client-secret= ${GITHUB_CLIENTSECRET:}
jwt.secret=${JWT_SECRET:}
# Expected: WEAK_SECRET_IN_CONFIG, CRITICAL (11 bytes)
app.jwt.signing-key=tooshortkey
# Expected: no finding (location, not key material)
jwt.private.key=classpath:app.key
# Expected: DEPRECATED_KEYSTORE_TYPE
server.ssl.key-store-type=JKS
# Expected: DEPRECATED_TLS_VERSION
server.ssl.protocol=TLSv1.1
